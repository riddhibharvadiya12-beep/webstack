<!DOCTYPE html>

  <style>
    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Poppins", sans-serif;
}

body{
  background:#f4f6fb;
  color:#222;
}

.header{
  text-align:center;
  padding:50px 20px;
  background:linear-gradient(135deg,#4f46e5,#9333ea);
  color:white;
}

.header h1{
  font-size:3rem;
}

.templates{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
  padding:40px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,0.1);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-content{
  padding:20px;
}

.card-content h3{
  margin-bottom:8px;
}

.card-content p{
  font-size:0.9rem;
  color:#555;
}

.download-btn{
  display:inline-block;
  margin-top:15px;
  padding:10px 18px;
  background:#4f46e5;
  color:white;
  border-radius:8px;
  text-decoration:none;
  font-weight:600;
}

.download-btn:hover{
  background:#3730a3;
}

.footer{
  text-align:center;
  padding:20px;
  color:#777;
}
.visitor-counter {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: linear-gradient(135deg, #4f46e5, #9333ea);
  color: #fff;
  padding: 12px 24px;
  border-radius: 50px;
  font-weight: 600;
  font-size: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  z-index: 999;
}

  </style>
</head>
